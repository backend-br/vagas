name: Job format

on:
  issues:
    types: [ 'opened', 'edited', 'labeled' ]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number. Leave empty to check every open issue.'
        required: false
        type: string
      dry-run:
        description: 'Only report the suggestions, without changing labels or comments.'
        required: false
        type: boolean
        default: true

concurrency:
  group: job-format-${{ github.event.issue.number || 'manual' }}

permissions:
  contents: read
  issues: write

jobs:
  format:
    name: Job format
    if: ${{ !github.event.issue.pull_request && (github.event.action != 'labeled' || github.event.label.name == 'aplicar-formato') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/triage
          persist-credentials: false

      - name: Suggest or apply the format of the form
        run: node .github/triage/job-format.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
