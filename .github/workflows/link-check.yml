name: Link check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number. Leave empty to check every open issue.'
        required: false
        type: string
      dry-run:
        description: 'Only report the broken links, without changing labels, comments or state.'
        required: false
        type: boolean
        default: true

concurrency:
  group: link-check

permissions: {}

jobs:
  check:
    name: Link check
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/triage
          persist-credentials: false

      - name: Check the links of the open jobs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/triage/link-check.mjs`)
            await run({ github })
