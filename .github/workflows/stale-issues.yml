name: Close stale issues

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  stale:
    permissions:
      actions: write
      issues: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/stale@v10
        with:
          ascending: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            Esta vaga está há um bom tempo sem novas interações. Se ainda estiver aberta, faça um comentário. Caso contrário, ela será fechada automaticamente em 2 dias.

            <details><summary>English</summary>

            This job post has had no activity for a long time. If it is still open, leave a comment. Otherwise, it will be closed automatically in 2 days.

            </details>
          close-issue-message: |
            Esta vaga foi fechada por estar há um bom tempo sem novas interações.

            <details><summary>English</summary>

            This job post was closed because it had no activity for a long time.

            </details>
          days-before-stale: 30
          days-before-close: 2

