name: Job triage

on:
  issues:
    types: [ 'opened', 'edited' ]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number. Leave empty to triage every open issue.'
        required: false
        type: string
      dry-run:
        description: 'Only report the verdicts, without changing labels, comments or state.'
        required: false
        type: boolean
        default: true

concurrency:
  group: triage-${{ github.event.issue.number || 'manual' }}

jobs:
  triage:
    if: ${{ !github.event.issue.pull_request }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/triage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Triage issues
        run: node .github/triage/triage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
