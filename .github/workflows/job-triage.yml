name: Job triage

on:
  issues:
    types: [ 'opened', 'edited' ]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number. Leave empty to triage every open issue.'
        required: false
        type: string
      dry-run:
        description: 'Only report the verdicts, without changing labels, comments or state.'
        required: false
        type: boolean
        default: true

concurrency:
  group: triage-${{ github.event.issue.number || 'manual' }}

permissions: {}

jobs:
  triage:
    name: Job triage
    if: ${{ !github.event.issue.pull_request }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/triage
          persist-credentials: false

      - name: Checkout shared taxonomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: backend-br/.github
          ref: main
          path: .shared
          sparse-checkout: taxonomy.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Triage issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TAXONOMY_FILE: ${{ github.workspace }}/.shared/taxonomy.json
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/triage/triage.mjs`)
            await run({ github })

  talent-match:
    name: Talent match
    needs: triage
    if: ${{ github.event_name == 'issues' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/triage
          persist-credentials: false

      - name: Checkout shared taxonomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: backend-br/.github
          ref: main
          path: .shared
          sparse-checkout: taxonomy.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Share matching profiles on the job
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TAXONOMY_FILE: ${{ github.workspace }}/.shared/taxonomy.json
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/triage/talent-match.mjs`)
            await run({ github })

  enable-schedules:
    name: Enable schedules
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
    permissions:
      actions: write
    uses: backend-br/.github/.github/workflows/enable-schedules.yml@ed405a15c3be6affe082f783f6e5b8fa0b6a3fb1
