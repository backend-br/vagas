name: Job triage

on:
  issues:
    types: [ 'opened', 'edited' ]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number. Leave empty to triage every open issue.'
        required: false
        type: string
      dry-run:
        description: 'Only report the verdicts, without changing labels, comments or state.'
        required: false
        type: boolean
        default: true

concurrency:
  group: triage-${{ github.event.issue.number || 'manual' }}

permissions: {}

jobs:
  triage:
    name: Job triage
    if: ${{ !github.event.issue.pull_request }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/triage
          persist-credentials: false

      - name: Triage issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/triage/triage.mjs`)
            await run({ github })
