name: Label issues

on:
  issues:
    types:
      - opened
      - edited

concurrency:
  group: label-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label-issue:
    name: Label issue
    permissions:
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Label issue from its content
        uses: Renato66/auto-label@f6a6e622dd6cab2171b38f4dd4616c1bf65a65dd
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          labels-not-allowed: '["stale"]'
