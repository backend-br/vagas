name: Auto assign pull requests

on:
  pull_request:
    types:
      - opened

concurrency:
  group: auto-assign-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-assign:
    name: Auto assign
    permissions:
      issues: write
      pull-requests: write
    uses: backend-br/.github/.github/workflows/auto-assign.yml@9e4bf553947273dcb44ef6ca52df19ce048b2820
    with:
      assignment-options: 'PULL_REQUEST'
